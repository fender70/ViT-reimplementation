[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vit-reimplementation"
version = "0.1.0"
description = "A from-scratch Vision Transformer implementation for learning and experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "torch",
    "torchvision",
    "tqdm",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vit_reimplementation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
